<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b1120"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Network connected points -->
  <line x1="20" y1="44" x2="32" y2="20" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="44" y2="34" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="44" x2="44" y2="34" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="20" cy="44" r="5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="32" cy="20" r="6" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="44" cy="34" r="5" fill="#06b6d4" filter="url(#glow)"/>
  <!-- Central letter S glow -->
  <text x="32" y="52" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#f8fafc" text-anchor="middle" letter-spacing="1">SS</text>
</svg>
